<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ec" />
  <title>观史</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4ec; color: #1b1a17; font-family: 'Noto Serif SC', 'Songti SC', serif; }
    .box { text-align: center; padding: 24px; }
    .mark { width: 72px; height: 72px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 50%; background: #1b1a17; color: #f7f4ec; font-size: 40px; border: 3px solid #c9a227; }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: .1em; margin: 0 0 10px; }
    p { color: #857f70; font-size: 13px; line-height: 1.8; margin: 0 0 22px; }
    button { border: 1px solid #1b1a17; background: transparent; padding: 10px 26px; font-size: 14px; border-radius: 999px; color: #1b1a17; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">史</div>
    <h1>观史</h1>
    <p>网络连接不可用，请检查网络后重试。<br>首次启动需要联网加载内容。</p>
    <button onclick="location.reload()">重试</button>
  </div>
</body>
</html>
